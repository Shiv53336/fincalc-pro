name: Build APK

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Decode and verify keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEY_ALIAS" ]       && missing="$missing KEY_ALIAS"
          [ -z "$STORE_PASSWORD" ]  && missing="$missing STORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ]    && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

          if [ ! -s android/app/keystore.jks ]; then
            echo "::error::Decoded keystore is empty. KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi

          if ! keytool -list -keystore android/app/keystore.jks \
                 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore is unreadable. Either KEYSTORE_BASE64 is corrupt, or the alias/password is wrong."
            echo "Re-encode with a single line and no trailing newline:  base64 -w 0 upload-keystore.jks"
            echo "Aliases found in the decoded keystore:"
            keytool -list -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" 2>&1 | head -20 || true
            exit 1
          fi

          echo "Keystore verified; alias '$KEY_ALIAS' found."

      - name: Build APK (debug)
        run: flutter build apk --debug --verbose

      - name: Build APK (release)
        env:
          KEYSTORE_PATH: keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Build AAB (release)
        env:
          KEYSTORE_PATH: keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fincalc-pro-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fincalc-pro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: fincalc-pro-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
